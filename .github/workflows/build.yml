name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable + setup
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Keep package list in sync with scripts/windows-deps.sh
      - name: Windows setup
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libtorrent-rasterbar
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-nsis
            zip
            unzip
            curl
            git

      - name: Version
        id: ver
        run: |
          VER="0.1.0+${GITHUB_SHA:0:7}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Portable version: $VER"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEZEUSZ_BUNDLED_DEPS=OFF \
            -DTEZEUSZ_VERSION="${{ steps.ver.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package portable + setup.exe
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          bash packaging/make-windows-portable.sh build/tezeusz.exe "build/tezeusz-portable" "$VER"
          # Same tree as portable - install under %LOCALAPPDATA%\Programs\Tezeusz
          # so the folder stays writable and in-app auto-update keeps working.
          bash packaging/make-windows-setup.sh \
            build/tezeusz-portable \
            "build/tezeusz-windows-setup.exe" \
            "$VER"
          test -f build/tezeusz-windows-setup.exe
          bash packaging/make-update-manifest.sh build/tezeusz-portable windows-x64 "$VER" build/update-windows
          # Auto-update must be able to find the Windows binary + libVLC core.
          MAN=build/update-windows/update-manifest-windows-x64.json
          test -f "$MAN"
          grep -q '"platform": "windows-x64"' "$MAN"
          grep -q '"path": "tezeusz.exe"' "$MAN"
          grep -q 'libvlc/libvlc.dll' "$MAN"
          test -f build/tezeusz-portable/tezeusz.exe
          test -f build/tezeusz-portable/libvlc/libvlc.dll
          test -d build/tezeusz-portable/libvlc/plugins
          (
            cd build
            rm -f "tezeusz-windows-portable-${VER}.zip"
            zip -r "tezeusz-windows-portable-${VER}.zip" tezeusz-portable
            rm -f "tezeusz-update-windows-${VER}.zip"
            zip -r "tezeusz-update-windows-${VER}.zip" update-windows
            # Stable + versioned setup names for the release page
            cp -f tezeusz-windows-setup.exe "tezeusz-windows-setup-${VER}.exe"
            ls -lah "tezeusz-windows-portable-${VER}.zip" \
                    "tezeusz-update-windows-${VER}.zip" \
                    tezeusz-windows-setup.exe \
                    "tezeusz-windows-setup-${VER}.exe"
          )

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: tezeusz-windows-portable
          path: build/tezeusz-windows-portable-*.zip
          if-no-files-found: error

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: tezeusz-windows-setup
          path: |
            build/tezeusz-windows-setup.exe
            build/tezeusz-windows-setup-*.exe
          if-no-files-found: error

      - name: Upload update pack
        uses: actions/upload-artifact@v4
        with:
          name: tezeusz-update-windows
          path: build/tezeusz-update-windows-*.zip
          if-no-files-found: error

  linux:
    name: Linux (Ubuntu) + .deb
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libglfw3-dev libgl1-mesa-dev \
            libcurl4-openssl-dev \
            libboost-dev \
            libtorrent-rasterbar-dev \
            zlib1g-dev \
            dpkg-dev debhelper \
            xvfb

      - name: Version
        id: ver
        run: |
          VER="0.1.0+${GITHUB_SHA:0:7}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEZEUSZ_BUNDLED_DEPS=OFF \
            -DTEZEUSZ_VERSION="${{ steps.ver.outputs.version }}" \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config Release

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb
          dpkg-deb -I ./*.deb
          dpkg-deb -c ./*.deb | head -n 40

      - name: Package linux portable + update manifest
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          OUT=build/tezeusz-linux-portable
          rm -rf "$OUT"
          mkdir -p "$OUT/fonts" "$OUT/icons" "$OUT/locales"
          cp -f build/tezeusz "$OUT/tezeusz"
          chmod +x "$OUT/tezeusz"
          cp -f vendor/logo_full.png vendor/icon.png vendor/poster_missing.png "$OUT/"
          cp -f vendor/fonts/*.ttf "$OUT/fonts/" 2>/dev/null || true
          cp -f vendor/icons/*.svg "$OUT/icons/" 2>/dev/null || true
          cp -f locales/*.json "$OUT/locales/" 2>/dev/null || true
          bash packaging/make-update-manifest.sh "$OUT" linux-x64 "$VER" build/update-linux
          (
            cd build
            rm -f "tezeusz-linux-portable-${VER}.zip"
            zip -r "tezeusz-linux-portable-${VER}.zip" tezeusz-linux-portable
            rm -f "tezeusz-update-linux-${VER}.zip"
            zip -r "tezeusz-update-linux-${VER}.zip" update-linux
            ls -lah "tezeusz-linux-portable-${VER}.zip" "tezeusz-update-linux-${VER}.zip"
          )

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tezeusz-linux
          path: build/tezeusz
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: tezeusz-deb
          path: build/*.deb
          if-no-files-found: error

      - name: Upload linux portable zip
        uses: actions/upload-artifact@v4
        with:
          name: tezeusz-linux-portable
          path: build/tezeusz-linux-portable-*.zip
          if-no-files-found: error

      - name: Upload linux update pack
        uses: actions/upload-artifact@v4
        with:
          name: tezeusz-update-linux
          path: build/tezeusz-update-linux-*.zip
          if-no-files-found: error

      - name: Smoke-test .deb
        run: |
          set -euo pipefail
          DEB=$(ls build/*.deb | head -n1)
          sudo apt-get install -y "./$DEB"
          command -v tezeusz
          ldd "$(command -v tezeusz)"
          test -f /usr/share/tezeusz/logo_full.png
          test -f /usr/share/tezeusz/fonts/Inter-Regular.ttf
          test -f /usr/share/tezeusz/locales/en.json
          test -f /usr/share/applications/tezeusz.desktop
          test -f /usr/share/pixmaps/tezeusz.png
          test -f /usr/share/icons/hicolor/128x128/apps/tezeusz.png
          grep -q 'StartupWMClass=tezeusz' /usr/share/applications/tezeusz.desktop
          # Headless runners often lack a usable GL stack; don't fail the job if
          # the GUI process dies under xvfb - packaging itself is already verified.
          set +e
          TEZEUSZ_DISABLE_UPDATE=1 TEZEUSZ_DISABLE_IMGSWARM=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 8s tezeusz 2>tezeusz-xvfb.log
          rc=$?
          set -e
          echo "xvfb tezeusz exit code: $rc"
          sed -n '1,40p' tezeusz-xvfb.log || true
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 0 ]; then
            echo "GUI smoke OK"
          else
            echo "GUI smoke skipped/non-fatal under xvfb (rc=$rc)"
          fi

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        id: prep
        run: |
          set -euo pipefail
          VER="${{ needs.linux.outputs.version }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.exe' -o -name 'tezeusz' \) -print
          # Windows setup.exe (preferred - per-user install, auto-updates without elevation)
          test -f dist/tezeusz-windows-setup/tezeusz-windows-setup.exe
          cp -f dist/tezeusz-windows-setup/tezeusz-windows-setup.exe release/
          cp -f dist/tezeusz-windows-setup/tezeusz-windows-setup-*.exe release/ 2>/dev/null || true
          # Portable Windows zip (same auto-update channel)
          test -n "$(ls -A dist/tezeusz-windows-portable/*.zip 2>/dev/null)"
          cp -f dist/tezeusz-windows-portable/*.zip release/
          # Linux portable zip (self-updating layout)
          test -n "$(ls -A dist/tezeusz-linux-portable/*.zip 2>/dev/null)"
          cp -f dist/tezeusz-linux-portable/*.zip release/
          # Debian package
          test -n "$(ls -A dist/tezeusz-deb/*.deb 2>/dev/null)"
          cp -f dist/tezeusz-deb/*.deb release/
          # Linux ELF binary (rename with version)
          if [[ -f dist/tezeusz-linux/tezeusz ]]; then
            cp -f dist/tezeusz-linux/tezeusz "release/tezeusz-linux-amd64-${VER}"
            chmod +x "release/tezeusz-linux-amd64-${VER}"
          fi
          # Unpack update packs for differential publish (required)
          mkdir -p update-publish
          test -n "$(ls -A dist/tezeusz-update-windows/*.zip 2>/dev/null)"
          test -n "$(ls -A dist/tezeusz-update-linux/*.zip 2>/dev/null)"
          for z in dist/tezeusz-update-windows/*.zip dist/tezeusz-update-linux/*.zip; do
            unzip -q -o "$z" -d update-publish
          done
          test -f update-publish/update-windows/update-manifest-windows-x64.json
          test -f update-publish/update-linux/update-manifest-linux-x64.json
          ls -lah release
          ls -lah update-publish
          test -n "$(ls -A release)"
          test -f release/tezeusz-windows-setup.exe

      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          ## Tezeusz ${VER}

          Automated build from \`main\` (\`${GITHUB_SHA:0:7}\`).

          ### Downloads
          - **Windows setup** - \`tezeusz-windows-setup.exe\` (installs to \`%LOCALAPPDATA%\\Programs\\Tezeusz\`, auto-updates in the background)
          - **Windows portable** - unzip and run \`tezeusz.exe\` (same auto-update channel)
          - **Linux portable** - unzip and run \`./tezeusz\` (auto-updates when folder is writable)
          - **Linux .deb** - \`sudo apt install ./tezeusz_*.deb\` (system install; auto-updates via pkexec permission prompt)
          - **Linux binary** - raw ELF (needs system GLFW/CURL/libtorrent)

          Updates download **only changed files** (SHA-256) from the \`continuous\` channel and restart automatically.
          The Windows installer uses a per-user folder so updates never need elevation.
          On Linux system installs Tezeusz asks for admin permission before writing to \`/usr\`.
          EOF
          )"
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous --title "Continuous build (${VER})" --notes "$NOTES"
            gh release upload continuous release/* --clobber
          else
            gh release create continuous release/* \
              --title "Continuous build (${VER})" \
              --notes "$NOTES" \
              --latest=false
          fi

          # Differential update blobs + manifests (required - never skip a platform)
          bash packaging/publish-update-assets.sh update-publish/update-windows windows-x64
          bash packaging/publish-update-assets.sh update-publish/update-linux linux-x64

          # Also keep a versioned release tag for this commit
          TAG="v${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Tezeusz ${VER}" \
              --notes "$NOTES" \
              --latest=true
          fi
