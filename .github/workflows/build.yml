name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libtorrent-rasterbar
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ntldd
            zip
            unzip
            curl
            mingw-w64-x86_64-curl

      - name: Version
        id: ver
        run: |
          VER="0.1.0+${GITHUB_SHA:0:7}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Portable version: $VER"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEERR_BUNDLED_DEPS=OFF \
            -DSEERR_VERSION="${{ steps.ver.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package portable
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          bash packaging/make-windows-portable.sh build/seerr.exe "build/seerr-portable" "$VER"
          bash packaging/make-update-manifest.sh build/seerr-portable windows-x64 "$VER" build/update-windows
          (
            cd build
            rm -f "seerr-windows-portable-${VER}.zip"
            zip -r "seerr-windows-portable-${VER}.zip" seerr-portable
            rm -f "seerr-update-windows-${VER}.zip"
            zip -r "seerr-update-windows-${VER}.zip" update-windows
            ls -lah "seerr-windows-portable-${VER}.zip" "seerr-update-windows-${VER}.zip"
          )

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: seerr-windows-portable
          path: build/seerr-windows-portable-*.zip
          if-no-files-found: error

      - name: Upload update pack
        uses: actions/upload-artifact@v4
        with:
          name: seerr-update-windows
          path: build/seerr-update-windows-*.zip
          if-no-files-found: error

  linux:
    name: Linux (Ubuntu) + .deb
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libglfw3-dev libgl1-mesa-dev \
            libcurl4-openssl-dev \
            libboost-dev \
            libtorrent-rasterbar-dev \
            zlib1g-dev \
            dpkg-dev debhelper \
            xvfb

      - name: Version
        id: ver
        run: |
          VER="0.1.0+${GITHUB_SHA:0:7}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEERR_BUNDLED_DEPS=OFF \
            -DSEERR_VERSION="${{ steps.ver.outputs.version }}" \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config Release

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb
          dpkg-deb -I ./*.deb
          dpkg-deb -c ./*.deb | head -n 40

      - name: Package linux portable + update manifest
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          OUT=build/seerr-linux-portable
          rm -rf "$OUT"
          mkdir -p "$OUT/fonts" "$OUT/icons" "$OUT/locales"
          cp -f build/seerr "$OUT/seerr"
          chmod +x "$OUT/seerr"
          cp -f vendor/logo_full.png vendor/icon.png vendor/poster_missing.png "$OUT/"
          cp -f vendor/fonts/*.ttf "$OUT/fonts/" 2>/dev/null || true
          cp -f vendor/icons/*.svg "$OUT/icons/" 2>/dev/null || true
          cp -f locales/*.json "$OUT/locales/" 2>/dev/null || true
          bash packaging/make-update-manifest.sh "$OUT" linux-x64 "$VER" build/update-linux
          (
            cd build
            rm -f "seerr-linux-portable-${VER}.zip"
            zip -r "seerr-linux-portable-${VER}.zip" seerr-linux-portable
            rm -f "seerr-update-linux-${VER}.zip"
            zip -r "seerr-update-linux-${VER}.zip" update-linux
            ls -lah "seerr-linux-portable-${VER}.zip" "seerr-update-linux-${VER}.zip"
          )

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: seerr-linux
          path: build/seerr
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: seerr-deb
          path: build/*.deb
          if-no-files-found: error

      - name: Upload linux portable zip
        uses: actions/upload-artifact@v4
        with:
          name: seerr-linux-portable
          path: build/seerr-linux-portable-*.zip
          if-no-files-found: error

      - name: Upload linux update pack
        uses: actions/upload-artifact@v4
        with:
          name: seerr-update-linux
          path: build/seerr-update-linux-*.zip
          if-no-files-found: error

      - name: Smoke-test .deb
        run: |
          set -euo pipefail
          DEB=$(ls build/*.deb | head -n1)
          sudo apt-get install -y "./$DEB"
          command -v seerr
          ldd "$(command -v seerr)"
          test -f /usr/share/seerr/logo_full.png
          test -f /usr/share/seerr/fonts/Inter-Regular.ttf
          test -f /usr/share/seerr/locales/en.json
          test -f /usr/share/applications/seerr.desktop
          test -f /usr/share/pixmaps/seerr.png
          # Headless runners often lack a usable GL stack; don't fail the job if
          # the GUI process dies under xvfb — packaging itself is already verified.
          set +e
          SEERR_DISABLE_UPDATE=1 SEERR_DISABLE_IMGSWARM=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 8s seerr 2>seerr-xvfb.log
          rc=$?
          set -e
          echo "xvfb seerr exit code: $rc"
          sed -n '1,40p' seerr-xvfb.log || true
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 0 ]; then
            echo "GUI smoke OK"
          else
            echo "GUI smoke skipped/non-fatal under xvfb (rc=$rc)"
          fi

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        id: prep
        run: |
          set -euo pipefail
          VER="${{ needs.linux.outputs.version }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.deb' -o -name 'seerr' \) -print
          # Portable Windows zip
          cp -f dist/seerr-windows-portable/*.zip release/ || true
          # Linux portable zip (self-updating layout)
          cp -f dist/seerr-linux-portable/*.zip release/ || true
          # Debian package
          cp -f dist/seerr-deb/*.deb release/ || true
          # Linux ELF binary (rename with version)
          if [[ -f dist/seerr-linux/seerr ]]; then
            cp -f dist/seerr-linux/seerr "release/seerr-linux-amd64-${VER}"
            chmod +x "release/seerr-linux-amd64-${VER}"
          fi
          # Unpack update packs for differential publish
          mkdir -p update-publish
          for z in dist/seerr-update-windows/*.zip dist/seerr-update-linux/*.zip; do
            [[ -f "$z" ]] || continue
            unzip -q -o "$z" -d update-publish
          done
          ls -lah release
          ls -lah update-publish || true
          test -n "$(ls -A release)"

      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          ## Seerr ${VER}

          Automated build from \`main\` (\`${GITHUB_SHA:0:7}\`).

          ### Downloads
          - **Windows portable** — unzip and run \`seerr.exe\` (auto-updates in the background)
          - **Linux portable** — unzip and run \`./seerr\` (auto-updates when folder is writable)
          - **Linux .deb** — \`sudo apt install ./seerr_*.deb\` (system install; auto-update needs a writable copy)
          - **Linux binary** — raw ELF (needs system GLFW/CURL/libtorrent)

          Updates download **only changed files** (SHA-256) from the \`continuous\` channel and restart automatically.
          EOF
          )"
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous --title "Continuous build (${VER})" --notes "$NOTES"
            gh release upload continuous release/* --clobber
          else
            gh release create continuous release/* \
              --title "Continuous build (${VER})" \
              --notes "$NOTES" \
              --latest=false
          fi

          # Differential update blobs + manifests (only new blobs uploaded)
          if [[ -d update-publish/update-windows ]]; then
            bash packaging/publish-update-assets.sh update-publish/update-windows windows-x64
          fi
          if [[ -d update-publish/update-linux ]]; then
            bash packaging/publish-update-assets.sh update-publish/update-linux linux-x64
          fi

          # Also keep a versioned release tag for this commit
          TAG="v${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Seerr ${VER}" \
              --notes "$NOTES" \
              --latest=true
          fi
