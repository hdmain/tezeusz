name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSYS2 MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libtorrent-rasterbar
            mingw-w64-x86_64-zlib

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEERR_BUNDLED_DEPS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seerr-windows
          path: build/seerr.exe
          if-no-files-found: error

  linux:
    name: Linux (Ubuntu) + .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libglfw3-dev libgl1-mesa-dev \
            libcurl4-openssl-dev \
            libboost-dev \
            libtorrent-rasterbar-dev \
            zlib1g-dev \
            dpkg-dev debhelper \
            xvfb

      - name: Version
        id: ver
        run: |
          VER="0.1.0+$(git rev-parse --short HEAD)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEERR_BUNDLED_DEPS=OFF \
            -DSEERR_VERSION="${{ steps.ver.outputs.version }}" \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config Release

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb
          dpkg-deb -I ./*.deb
          dpkg-deb -c ./*.deb | head -n 40

      - name: Smoke-test .deb
        run: |
          set -euo pipefail
          DEB=$(ls build/*.deb | head -n1)
          sudo apt-get install -y "./$DEB"
          command -v seerr
          ldd "$(command -v seerr)"
          test -f /usr/share/seerr/logo_full.png
          test -f /usr/share/seerr/fonts/Inter-Regular.ttf
          test -f /usr/share/seerr/locales/en.json
          test -f /usr/share/applications/seerr.desktop
          # App should start under a virtual display; timeout=124 means it was still running.
          set +e
          xvfb-run -a timeout 5s seerr
          rc=$?
          set -e
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "seerr exited with unexpected code $rc" >&2
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: seerr-linux
          path: build/seerr
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: seerr-deb
          path: build/*.deb
          if-no-files-found: error
